# The golden path from kindorg-hq/ci (v3): checks on every PR; a merge to
# master is built, accepted and, when it carries a Releasable change, released
# and delivered to the cluster. How it works: https://github.com/kindorg-hq/ci
name: pipeline

on:
  pull_request:
  push:
    branches: [master]
  # Re-deliver the latest Release (a delivery that died on the way). Not a
  # rollback: it cannot deliver an older version, and it never rebuilds.
  workflow_dispatch:

jobs:
  # keep the job id: it is the first part of every check name
  golden-path:
    uses: kindorg-hq/ci/.github/workflows/golden-path.yml@v3
    permissions: {contents: read, packages: write, pull-requests: write, deployments: write}
    with:
      app: pepic
      images: '[{"name": "pepic"}]'
      url: https://media.heynik.blog
    secrets: inherit
