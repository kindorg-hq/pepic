name: Build and publish (arm64)

# The upstream workflow builds amd64 and pushes under the committer's account.
# We need arm64 (the cluster runs on an M1 iMac) and a SHA tag, so that ArgoCD
# sees a specific version rather than a floating latest.
#
# ubuntu-24.04-arm is a native arm64 runner, free for public repositories. That
# matters here: the Dockerfile uses CGO with vips and ffmpeg, and building that
# under QEMU would take disproportionately long.

# RETIRED: pipeline.yml (kindorg-hq/ci golden path) builds and delivers now —
# only releases. This stays as a manual fallback until the first release
# goes out through the new path, then it is deleted.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # without buildx the default driver cannot export a cache:
      # "Cache export is not supported for the docker driver"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pepic:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/pepic:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Bump image tag in GitOps repo
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    # ArgoCD performs the rollout, not CI: this job only records the new
    # image tag in homelab-k8s. Same as the.blog and jtbd-graph. The deploy
    # key "CI pepic (write)" on homelab-k8s is this repo's own, so it can be
    # revoked without touching the others.
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kindorg-hq/homelab-k8s
          ssh-key: ${{ secrets.GITOPS_SSH_KEY }}
          ref: main

      - name: Bump image tag
        run: |
          set -euo pipefail
          cd manifests/pepic/base
          if grep -q "newTag: $GITHUB_SHA" kustomization.yaml; then
            echo "Tag already at $GITHUB_SHA, nothing to commit"
            exit 0
          fi
          kustomize edit set image "ghcr.io/${{ github.repository_owner }}/pepic:$GITHUB_SHA"
          cat kustomization.yaml
          cd -
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(pepic): image $(echo $GITHUB_SHA | cut -c1-12)"
          git push origin main

      - name: Summary
        run: |
          echo "Image: ghcr.io/${{ github.repository_owner }}/pepic:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Tag written to homelab-k8s; ArgoCD will roll it out." >> $GITHUB_STEP_SUMMARY
