# ci v4 (kindorg-hq/ci): what a pull request runs — Build → Accept.
# Publishes nothing. How it works: https://github.com/kindorg-hq/ci
name: pull-request
run-name: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  pull_request:

jobs:
  # keep the job id: it is the first part of every check name (ci / Build, ci / Accept)
  ci:
    uses: kindorg-hq/ci/.github/workflows/pull-request.yml@v4
    permissions: {contents: read, pull-requests: read}
    with:
      images: '[{"name": "pepic"}]'
